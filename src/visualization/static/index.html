<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>托洛洛Agent - 知识图谱</title>
<style>
*{margin:0;padding:0}
body{background:#1e1e1e;overflow:hidden;font-family:'Microsoft YaHei',sans-serif}
#header{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(30,30,30,.95);padding:12px 20px;border-bottom:1px solid #333;display:flex;align-items:center}
#header h1{color:#4fc3f7;font-size:18px;margin:0}
#header .info{color:#aaa;font-size:12px;margin-left:20px}
#header .info span{color:#4fc3f7;margin:0 3px}
svg{display:block;width:100vw;height:100vh}
#legend{position:fixed;bottom:20px;right:20px;background:rgba(30,30,30,.95);padding:12px;border-radius:6px;border:1px solid #333;z-index:10;color:#ccc;font-size:12px;max-height:70vh;overflow-y:auto}
#legend .row{margin:4px 0;display:flex;align-items:center}
#legend .dot{width:12px;height:12px;border-radius:50%;margin-right:8px;flex-shrink:0}
#tooltip{position:fixed;background:rgba(0,0,0,.9);color:#fff;padding:8px 12px;border-radius:4px;font-size:13px;display:none;z-index:100;max-width:350px;border:1px solid #4fc3f7;pointer-events:none;line-height:1.4}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#4fc3f7;font-size:18px;z-index:5}
</style>
</head>
<body>
<div id="header">
  <h1>托洛洛Agent - 知识图谱</h1>
  <div class="info">节点: <span id="nodeCount">-</span> | 关系: <span id="relCount">-</span></div>
</div>
<div id="tooltip"></div>
<div id="legend"></div>
<div id="loading">加载知识图谱中...</div>
<svg id="graph"></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
var W = window.innerWidth;
var H = window.innerHeight;
var svg = d3.select('#graph').attr('width', W).attr('height', H);
var g = svg.append('g');

svg.call(d3.zoom().scaleExtent([0.1, 8]).on('zoom', function(e) {
  g.attr('transform', e.transform);
}));

var colors = {
  Planet: '#4fc3f7', Star: '#ffd54f', Satellite: '#81c784',
  CelestialBody: '#64b5f6', Mission: '#ff8a65', Asteroid: '#a1887f',
  Comet: '#fff176', DwarfPlanet: '#ce93d8', PlanetType: '#4db6ac',
  Entity: '#78909c', Default: '#90a4ae'
};

fetch('/api/graph').then(function(r) { return r.json(); }).then(function(data) {
  document.getElementById('loading').style.display = 'none';
  if (data.error) {
    document.getElementById('header').innerHTML += '<span style="color:red;margin-left:20px">Neo4j连接失败</span>';
    return;
  }

  document.getElementById('nodeCount').textContent = data.nodes.length;
  document.getElementById('relCount').textContent = data.links.length;

  // 图例
  var groups = [];
  data.nodes.forEach(function(n) {
    if (groups.indexOf(n.group) === -1) groups.push(n.group);
  });
  groups.forEach(function(g) {
    var row = document.createElement('div');
    row.className = 'row';
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = colors[g] || '#90a4ae';
    row.appendChild(dot);
    row.appendChild(document.createTextNode(g));
    document.getElementById('legend').appendChild(row);
  });

  // 计算连接数
  data.nodes.forEach(function(n) { n.linkCount = 0; });
  data.links.forEach(function(l) {
    data.nodes.forEach(function(n) {
      if (n.id === l.source || n.id === l.target) n.linkCount++;
    });
  });

  // 初始位置随机散布
  data.nodes.forEach(function(n) {
    n.x = W / 2 + (Math.random() - 0.5) * 600;
    n.y = H / 2 + (Math.random() - 0.5) * 600;
  });

  var sim = d3.forceSimulation(data.nodes)
    .force('link', d3.forceLink(data.links).id(function(d) { return d.id; }).distance(150).strength(0.1))
    .force('charge', d3.forceManyBody().strength(-500))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(35))
    .alphaDecay(0.003).velocityDecay(0.35);

  var link = g.append('g').selectAll('line').data(data.links).join('line')
    .attr('stroke', 'rgba(255,255,255,0.12)').attr('stroke-width', 1);

  var node = g.append('g').selectAll('g').data(data.nodes).join('g')
    .call(d3.drag()
      .on('start', function(e, d) {
        if (!e.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', function(e, d) { d.fx = e.x; d.fy = e.y; })
      .on('end', function(e, d) {
        if (!e.active) sim.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
    );

  node.append('circle')
    .attr('r', function(d) { return Math.max(5, Math.min(15, 3 + d.linkCount)); })
    .attr('fill', function(d) { return colors[d.group] || '#90a4ae'; })
    .attr('stroke', '#fff').attr('stroke-width', 1.5);

  node.append('text')
    .text(function(d) { return d.name.length > 8 ? d.name.slice(0, 8) + '..' : d.name; })
    .attr('dx', 15).attr('dy', 5)
    .style('font-size', '12px').style('fill', '#ddd');

  node.on('mouseover', function(e, d) {
    document.getElementById('tooltip').style.display = 'block';
    document.getElementById('tooltip').innerHTML = '<b>' + d.name + '</b><br>类型: ' + d.group + '<br>连接: ' + d.linkCount;
  }).on('mousemove', function(e) {
    document.getElementById('tooltip').style.left = (e.clientX + 15) + 'px';
    document.getElementById('tooltip').style.top = (e.clientY - 10) + 'px';
  }).on('mouseout', function() {
    document.getElementById('tooltip').style.display = 'none';
  });

  // tick渲染
  sim.on('tick', function() {
    link.attr('x1', function(d) { return d.source.x; })
        .attr('y1', function(d) { return d.source.y; })
        .attr('x2', function(d) { return d.target.x; })
        .attr('y2', function(d) { return d.target.y; });
    node.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
  });
}).catch(function(err) {
  document.getElementById('loading').textContent = '加载失败: ' + err;
});
</script>
</body>
</html>
